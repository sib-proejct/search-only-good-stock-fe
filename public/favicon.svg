<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle with Apple Blue / Trust Navy -->
  <rect width="64" height="64" rx="16" fill="#0071E3" />
  
  <!-- Outer glow/rim -->
  <rect x="2" y="2" width="60" height="60" rx="14" stroke="rgba(255,255,255,0.2)" stroke-width="2" />

  <!-- Suit & Collar -->
  <path d="M10 64 C12 55 18 52 24 50 L32 58 L40 50 C46 52 52 55 54 64 Z" fill="#0F172A" />
  <!-- White Shirt Collar -->
  <polygon points="25,50 32,58 39,50 35,48 29,48" fill="#FFFFFF" />
  <!-- Red Tie (Buffett Signature) -->
  <polygon points="30.5,52 33.5,52 34.5,64 29.5,64" fill="#E11D48" />

  <!-- Ears -->
  <circle cx="15" cy="35" r="4.5" fill="#FCD3AD" />
  <circle cx="49" cy="35" r="4.5" fill="#FCD3AD" />

  <!-- Head / Face -->
  <path d="M17 32 C17 19 22 17 32 17 C42 17 47 19 47 32 C47 43 43 49 32 49 C21 49 17 43 17 32 Z" fill="#FEE0C2" />

  <!-- Hair (Signature White Fluffy Hair) -->
  <path d="M14 30 C12 21 16 11 32 11 C48 11 52 21 50 30 C47 32 46 25 43 19 C39 14 25 14 21 19 C18 25 17 32 14 30 Z" fill="#FFFFFF" />
  <path d="M13 28 C12 33 14 37 16 38 C15 35 15 30 16 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <path d="M51 28 C52 33 50 37 48 38 C49 35 49 30 48 26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />

  <!-- White Eyebrows -->
  <path d="M20 25 Q25 22 29 25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />
  <path d="M35 25 Q39 22 44 25" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" fill="none" />

  <!-- Glasses (Iconic Thick Dark Frames) -->
  <!-- Left Rim -->
  <rect x="19" y="27" width="10.5" height="9" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" stroke="#1E293B" stroke-width="2.2" />
  <!-- Right Rim -->
  <rect x="34.5" y="27" width="10.5" height="9" rx="2.5" fill="#FFFFFF" fill-opacity="0.3" stroke="#1E293B" stroke-width="2.2" />
  <!-- Bridge -->
  <path d="M29.5 30.5 H34.5" stroke="#1E293B" stroke-width="2.2" stroke-linecap="round" />
  <!-- Temples -->
  <path d="M15 30 L19 30 M45 30 L49 30" stroke="#1E293B" stroke-width="2" stroke-linecap="round" />

  <!-- Eyes (Happy / Wise Smile) -->
  <path d="M22 31.5 Q24.2 29.5 26.5 31.5" stroke="#0F172A" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M37.5 31.5 Q39.7 29.5 42 31.5" stroke="#0F172A" stroke-width="2" stroke-linecap="round" fill="none" />

  <!-- Nose -->
  <path d="M31 34 Q32 38 34 37" stroke="#E29578" stroke-width="1.8" stroke-linecap="round" fill="none" />

  <!-- Warm Smile -->
  <path d="M26 42 Q32 47 38 42" stroke="#BE123C" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <!-- Laugh Lines -->
  <path d="M24 41 Q23 43 24 45" stroke="#E29578" stroke-width="1.4" stroke-linecap="round" fill="none" />
  <path d="M40 41 Q41 43 40 45" stroke="#E29578" stroke-width="1.4" stroke-linecap="round" fill="none" />
</svg>
